<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<title>Contact Us — Go to the Campus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
  <section class="page-hero photo" style="background-image:url('https://campus.cru.org/high-school/go-to-the-campus/wp-content/uploads/sites/563/2023/05/join_header_big.jpg')">
    <span class="wf-tag">Page hero</span>
    <div class="wrap">
      <div class="crumb"><a href="index.html">Home</a> / <strong>Contact Us</strong></div>
      <h1>Contact Us</h1>
      <p>Thanks for reaching out. We love to hear from this community and we’re constantly making changes based on your feedback.</p>
    </div>
  </section>
  <section class="pad">
    <span class="wf-tag">Contact form (wireframe — not wired up)</span>
    <div class="wrap prose">
      <form class="wf-form" onsubmit="return false;">
        <div class="row2">
          <label>First <input type="text" name="first"></label>
          <label>Last <input type="text" name="last"></label>
        </div>
        <label>Email* <input type="email" name="email" required></label>
        <label>I am a
          <select name="role"><option>Select one</option><option>Student</option><option>Volunteer</option><option>Cru staff</option><option>Parent</option><option>Teacher or school staff</option></select>
        </label>
        <label>I have a
          <select name="kind"><option>Select one</option><option>Question</option><option>Resource to share</option><option>Suggestion</option></select>
        </label>
        <label>Share your thoughts below* <textarea name="message" rows="6" required></textarea></label>
        <fieldset>
          <legend>May we follow up with you?</legend>
          <label class="inline"><input type="radio" name="followup" value="yes" checked> Yes</label>
          <label class="inline"><input type="radio" name="followup" value="no"> No</label>
        </fieldset>
        <label>File <input type="file" name="file"></label>
        <button type="submit" class="btn-y">Send</button>
        <p class="muted" style="font-size:.85rem;margin-top:10px;">Wireframe only — this form does not submit anywhere.</p>
      </form>
    </div>
  </section>
</main>
<script src="site.js"></script>
</body>
</html>
